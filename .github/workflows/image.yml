# Builds the AgentDiscover container images and pushes them to ghcr.io:
#   - the platform image  ghcr.io/<owner>/agentdiscover  (Dockerfile at the root)
#   - per-problem evaluator images  ghcr.io/<owner>/agentdiscover-eval-<problem>,
#     built from problems/<problem>/evaluator/Dockerfile when one exists
#
# Make the packages public once, in the repository's Packages settings, so clusters
# can pull without a token.

name: build images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'problems/*/evaluator/Dockerfile'
      - '.github/workflows/image.yml'
  workflow_dispatch:        # lets you build on demand from the Actions tab

jobs:
  platform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentdiscover:latest
            ghcr.io/${{ github.repository_owner }}/agentdiscover:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  find-evaluators:
    runs-on: ubuntu-latest
    outputs:
      problems: ${{ steps.list.outputs.problems }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          problems=$(for d in problems/*/evaluator/Dockerfile; do
            [ -f "$d" ] && basename "$(dirname "$(dirname "$d")")"
          done | jq -R . | jq -cs .)
          echo "problems=$problems" >> "$GITHUB_OUTPUT"

  evaluators:
    needs: find-evaluators
    if: ${{ needs.find-evaluators.outputs.problems != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        problem: ${{ fromJson(needs.find-evaluators.outputs.problems) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: problems/${{ matrix.problem }}/evaluator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentdiscover-eval-${{ matrix.problem }}:latest
            ghcr.io/${{ github.repository_owner }}/agentdiscover-eval-${{ matrix.problem }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
